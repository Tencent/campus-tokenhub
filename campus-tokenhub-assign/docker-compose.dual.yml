# 双站同域部署：一个 Postgres、一套 nginx、两个 Next 应用。
#
#   统一采买站  /tokenhub/portal  →  portal         （basePath=/tokenhub/portal）
#   成员自购站  /tokenhub/member  →  portal-member  （basePath=/tokenhub/member）
#
# 两站共享同一个 portal_session：
#   SESSION_SECRET 相同 + PORTAL_COOKIE_PATH=/tokenhub（公共前缀）+ PORTAL_COOKIE_DOMAIN 留空。
# 因此在任一站登录后，另一站无需二次登录；登出任一站，两站同时失效。
#
# ── 前置：网关由统一采买站仓库自己的 compose 起 ─────────────────────────────
#   网关（gateway-proxy / gateway-admin）与本地联调栈强绑定（要挂 local-stack 源码），
#   所以不在这里重复编排。先起它：
#     cd . && docker compose up -d postgres gateway-proxy gateway-admin
#   它创建的网络名是 `campus-tokenhub_default`，本文件以 external 方式接入。
#
# ── 起法 ────────────────────────────────────────────────────────────────────
#   cp .env.dual.example .env.dual && vim .env.dual     # 填 POSTGRES_PASSWORD / SESSION_SECRET
#   docker compose -f docker-compose.dual.yml --env-file .env.dual up -d --build
#
# ── 只部署其中一站 ──────────────────────────────────────────────────────────
#   不要用本文件：各仓库目录下有单站用的 docker-compose.yml。

name: campus-tokenhub-dual

services:
  # ---------------------------------------------------------------- 数据库
  # 复用旧栈的数据卷：旧 portal schema 的数据仍在，迁移脚本从那里搬到新 schema。
  # 卷名写死 external：删掉旧 compose 后卷还在，改名会找不到数据。
  postgres:
    image: postgres:16-alpine
    container_name: campus-tokenhub-dual-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octafuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_MUST_BE_SET}
      POSTGRES_DB: ${POSTGRES_DB:-octafuse}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default

  # ---------------------------------------------------------------- 网关
  # 用旧栈已构建好的镜像（不重新 build：local-stack 源码已不在新仓库里）。
  # 统一采买站的发 Key、额度、模型目录、管理后台都靠这两个服务。
  gateway-admin:
    image: octafuse-admin:local
    container_name: campus-tokenhub-dual-gateway-admin
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-octafuse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_MUST_BE_SET}@postgres:5432/${POSTGRES_DB:-octafuse}
      PORT: '8789'
      ADMIN_USERNAME: ${OCTAFUSE_ADMIN_USERNAME:?OCTAFUSE_ADMIN_USERNAME_MUST_BE_SET}
      ADMIN_PASSWORD: ${OCTAFUSE_ADMIN_PASSWORD:?OCTAFUSE_ADMIN_PASSWORD_MUST_BE_SET}
      ADMIN_COOKIE_SECURE: ''
      # 必须与镜像构建期一致：octafuse-admin:local 是按 /tokenhub/admin 构建的，
      # 入口脚本会做前缀自检，不一致直接 exit 1。运行期不参与路由（nginx 剥前缀）。
      ADMIN_UI_PUBLIC_PATH: ${ADMIN_UI_PUBLIC_PATH:-/tokenhub/admin}
      # 与管理台共用门户会话：同 SESSION_SECRET，登录后两边都能进
      PORTAL_SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET_MUST_BE_SET}
      PORTAL_LOGIN_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL_MUST_BE_SET}/tokenhub/portal/login
      PORTAL_LOGOUT_URL: http://portal:3000/tokenhub/portal/api/auth/logout
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 管理端根路径返回 SPA 入口即视为就绪（/api/health 在该服务上不存在）
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8789/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default

  gateway-proxy:
    image: octafuse-proxy:local
    container_name: campus-tokenhub-dual-gateway-proxy
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-octafuse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_MUST_BE_SET}@postgres:5432/${POSTGRES_DB:-octafuse}
      PORT: '8787'
      REQUEST_CONTENT_CAPTURE: ${REQUEST_CONTENT_CAPTURE:-on}
    ports:
      # 「在线调试台」由浏览器直连这个地址（NEXT_PUBLIC_PROXY_BASE），
      # 不映射的话页面能打开、点「发送请求」直接连不上。
      - '127.0.0.1:${GATEWAY_PROXY_HOST_PORT:-8790}:8787'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ---------------------------------------------------------------- 统一采买站
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # **构建期生效**：Next 的 basePath 编译进产物，改了必须 --build
        PORTAL_BASE_PATH: /tokenhub/portal
    image: campus-tokenhub-assign:dual
    container_name: campus-tokenhub-dual-assign
    restart: unless-stopped
    env_file:
      # 双站专用；部署时从 .env.dual.example 复制一份填写
      - path: .env.dual
        required: false
    environment:
      # 与成员站同一个库：共享层 portal_shared 只有一份，两侧看到的名单/登录配置完全一致
      PORTAL_DATABASE_URL: postgres://${POSTGRES_USER:-octafuse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_MUST_BE_SET}@postgres:5432/${POSTGRES_DB:-octafuse}
      PORTAL_BASE_PATH: /tokenhub/portal
      PORTAL_COOKIE_PATH: /tokenhub
      PORTAL_COOKIE_DOMAIN: ${PORTAL_COOKIE_DOMAIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL_MUST_BE_SET}
      # 双站部署专属：侧边栏「用户入口」据此显示「成员账号 ↗」，跳到成员站 /members
      MEMBER_PUBLIC_BASE_URL: ${MEMBER_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL:?PUBLIC_BASE_URL_MUST_BE_SET}/tokenhub/member}
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      OCTAFUSE_ADMIN_BASE: ${OCTAFUSE_ADMIN_BASE:-http://gateway-admin:8789}
      OCTAFUSE_PROXY_BASE: ${OCTAFUSE_PROXY_BASE:-http://gateway-proxy:8787}
      # 统一采买站用网关开户，这三项是配置必填项（不连通也能启动，只是网关相关页面无数据）
      OCTAFUSE_ADMIN_USERNAME: ${OCTAFUSE_ADMIN_USERNAME:?OCTAFUSE_ADMIN_USERNAME_MUST_BE_SET}
      OCTAFUSE_ADMIN_PASSWORD: ${OCTAFUSE_ADMIN_PASSWORD:?OCTAFUSE_ADMIN_PASSWORD_MUST_BE_SET}
      OCTAFUSE_EXTERNAL_SYSTEM: ${OCTAFUSE_EXTERNAL_SYSTEM:-campus-tokenhub}
      NEXT_PUBLIC_PROXY_BASE: ${NEXT_PUBLIC_PROXY_BASE:-http://localhost:8790}
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME:-}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_ADMIN_LOGIN: ${PORTAL_ADMIN_LOGIN:-auto}
      PORTAL_DATA_DIR: /app/.data
    volumes:
      - assign_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      # 必须等就绪：门户一起来就调 /api/admin/config，网关没监听会抛错，
      # 初始化页会显示「暂时读不到网关状态」（刷新后又能好，很难查）
      gateway-admin:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/tokenhub/portal/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- 成员自购站
  portal-member:
    build:
      context: ../campus-tokenhub-member
      dockerfile: Dockerfile
      args:
        PORTAL_BASE_PATH: /tokenhub/member
    image: campus-tokenhub-member:dual
    container_name: campus-tokenhub-dual-member
    restart: unless-stopped
    env_file:
      # 双站专用；部署时从 .env.dual.example 复制一份填写
      - path: .env.dual
        required: false
    environment:
      # 同一个库：共享层由此只有一份
      PORTAL_DATABASE_URL: postgres://${POSTGRES_USER:-octafuse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_MUST_BE_SET}@postgres:5432/${POSTGRES_DB:-octafuse}
      PORTAL_BASE_PATH: /tokenhub/member
      PORTAL_COOKIE_PATH: /tokenhub
      PORTAL_COOKIE_DOMAIN: ${PORTAL_COOKIE_DOMAIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL_MUST_BE_SET}
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      # 成员站没有网关：不注入任何 OCTAFUSE_*，也不依赖 gateway 服务
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME:-}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_ADMIN_LOGIN: ${PORTAL_ADMIN_LOGIN:-auto}
      PORTAL_DATA_DIR: /app/.data
    volumes:
      - member_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/tokenhub/member/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------- 入口
  nginx:
    image: nginx:alpine
    container_name: campus-tokenhub-dual-nginx
    restart: unless-stopped
    volumes:
      # 完整版：两站 + /tokenhub/admin + /tokenhub/*（网关）。模板走 envsubst 渲染。
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # 生产由 CLB 终止 TLS，这里固定 https；本地 HTTP 直连时改成 http
      NGINX_PUBLIC_PROTO: ${NGINX_PUBLIC_PROTO:-http}
      # 后端容器名的解析 DNS：Docker 内置 DNS 为 127.0.0.11；裸机部署改成自己的 DNS
      NGINX_RESOLVER: ${NGINX_RESOLVER:-127.0.0.11}
    ports:
      - '${NGINX_HOST_BIND:-0.0.0.0}:${NGINX_HOST_PORT:-8088}:80'
    depends_on:
      portal:
        condition: service_healthy
      portal-member:
        condition: service_healthy

networks:
  default: {}

volumes:
  # 旧栈的数据卷，改名会丢数据
  pgdata:
    external: true
    name: campus-tokenhub_octafuse_pgdata
  assign_data:
  member_data:
