# 双站同域部署的最小 nginx 示例（本地验证用，生产以 deploy/nginx.conf.template 为准）。
#
# 形态：一个域名，两个前缀
#   /tokenhub/portal/**  → 统一采买站（Next basePath=/tokenhub/portal）
#   /tokenhub/member/**  → 成员自购站（Next basePath=/tokenhub/member）
#
# 两站共享同一个 portal_session：
#   两侧 PORTAL_COOKIE_PATH=/tokenhub（公共前缀）、PORTAL_COOKIE_DOMAIN 留空、SESSION_SECRET 相同。
#
# 本地起法：docker run -d -p 8188:80 \
#   -v $PWD/deploy/nginx-dual.example.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

upstream portal_upstream { server portal:3000; keepalive 16; }
upstream member_upstream { server portal-member:3000; keepalive 16; }

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location = /nginx-health { access_log off; return 200 'ok'; }

    # 统一采买站（Next basePath=/tokenhub/portal，原样透传）
    location = /tokenhub/portal { proxy_pass http://portal_upstream; }
    location /tokenhub/portal/ { proxy_pass http://portal_upstream; }

    # 成员自购站（Next basePath=/tokenhub/member，原样透传）
    location = /tokenhub/member { proxy_pass http://member_upstream; }
    location /tokenhub/member/ { proxy_pass http://member_upstream; }

    location / { return 404; }
}
